[project]
name = "minecraft-skript-agent"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Hakob", email = "hatajyan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-core>=1.7.0",
